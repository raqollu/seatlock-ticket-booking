name: Verify booking invariants
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tickets_test
          POSTGRES_USER: tickets
          POSTGRES_PASSWORD: tickets
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U tickets -d tickets_test" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp verify
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/tickets_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            target/site/jacoco
            target/surefire-reports
